<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gran Rifa - Licuadora Dorada</title>
  <style>
    :root {
      --bg-dark: #120806;
      --card-bg: #1c100c;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --red-accent: #991b1b;
      --text-main: #f9fafb;
      --text-muted: #d1d5db;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      margin: 0;
      padding: 0;
      color: var(--text-main);
    }

    /* Portada y Perfil */
    .profile-header {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: #000;
    }

    .portada-img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      filter: brightness(0.9);
      border-bottom: 2px solid var(--gold);
    }

    .profile-bar {
      max-width: 480px;
      margin: -42px auto 0 auto;
      padding: 0 16px;
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      z-index: 10;
    }

    .avatar-wrapper {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 3px solid var(--gold);
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.8), 0 0 12px rgba(212, 175, 55, 0.4);
      background: #1c100c;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title-group {
      padding-bottom: 4px;
      text-align: left;
    }

    .title-group h1 {
      font-size: 1.35rem;
      margin: 0;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .title-group span {
      font-size: 0.8rem;
      color: var(--gold-light);
      opacity: 0.9;
    }

    .container {
      max-width: 480px;
      margin: 14px auto 30px auto;
      background: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    p.sub {
      text-align: left;
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 0;
      margin-bottom: 16px;
    }

    /* Caja de Pago Móvil */
    .info-pago {
      background: rgba(28, 16, 12, 0.95);
      border: 1.5px solid var(--gold);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      margin-bottom: 18px;
      box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.1);
    }

    .info-pago strong {
      color: var(--gold-light);
    }

    .btn-copiar {
      margin-top: 10px;
      width: 100%;
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #120806;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-copiar:active {
      transform: scale(0.98);
    }

    /* Cuadrícula de Números */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 18px;
      max-height: 260px;
      overflow-y: auto;
      padding: 6px;
      background: rgba(0,0,0,0.35);
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    .num-btn {
      padding: 10px 0;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 6px;
      background: #261712;
      color: var(--text-main);
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .num-btn.ocupado {
      background: #450a0a;
      border-color: #7f1d1d;
      color: #fca5a5;
      text-decoration: line-through;
      cursor: not-allowed;
      opacity: 0.65;
    }

    .num-btn.seleccionado {
      background: #059669;
      border-color: #10b981;
      color: #fff;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: var(--gold-light);
    }

    input[type="text"], input[type="tel"], input[type="file"] {
      width: 100%;
      padding: 11px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
      background: #0f0705;
      color: #fff;
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .monto-box {
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #120806;
      padding: 10px;
      border-radius: 8px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 16px;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
      transition: 0.2s;
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    button[type="submit"]:disabled {
      background: #4b5563;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<!-- Portada desde Google Drive -->
<div class="profile-header">
  <img 
    src="https://lh3.googleusercontent.com/d/1prhZMluENec2Q3zMwKFrGA-GDTAKkdJM" 
    alt="Portada Gran Rifa" 
    class="portada-img"
    onerror="this.src='https://raw.githubusercontent.com/BatmanImperium/registros-de-pagos/main/1000271175.jpg'"
  >
</div>

<!-- Barra con Foto de Perfil a la izquierda y Título -->
<div class="profile-bar">
  <div class="avatar-wrapper">
    <img 
      src="https://raw.githubusercontent.com/BatmanImperium/registros-de-pagos/main/1000271175.jpg" 
      alt="Logo Empresa" 
      class="avatar-img"
    >
  </div>
  <div class="title-group">
    <h1>Licuadora Dorada</h1>
    <span>Gran Rifa • Tickets del 00 al 70</span>
  </div>
</div>

<div class="container">
  <p class="sub">Selecciona tus números disponibles, realiza el Pago Móvil y sube tu comprobante.</p>

  <div class="info-pago">
    <strong>📱 Datos de Pago Móvil:</strong><br>
    • Banco: <strong>0102</strong><br>
    • Teléfono: <strong>04241301804</strong><br>
    • Cédula/RIF: <strong>V-31758835</strong><br>
    • Valor por ticket: <strong>800 Bs</strong>
    <button type="button" class="btn-copiar" onclick="copiarDatos()">📋 Copiar datos de pago</button>
  </div>

  <div id="grid" class="grid">Cargando números...</div>

  <form id="rifaForm">
    <div class="form-group">
      <label>Números seleccionados:</label>
      <input type="text" id="numerosSeleccionados" readonly placeholder="Toca tus números arriba" required>
    </div>
    
    <div class="monto-box" id="montoTotal">Total a pagar: 0 Bs</div>

    <div class="form-group">
      <label>Nombre y Apellido:</label>
      <input type="text" id="nombre" placeholder="Ej. Carlos Pérez" required>
    </div>
    <div class="form-group">
      <label>Teléfono (WhatsApp):</label>
      <input type="tel" id="telefono" placeholder="Ej. 04241234567" required>
    </div>
    <div class="form-group">
      <label>Comprobante de pago (Captura):</label>
      <input type="file" id="comprobante" accept="image/*" required>
    </div>
    <button type="submit" id="btnEnviar">Apartar Números</button>
    <div id="statusMsg" class="status"></div>
  </form>
</div>

<script>
  const API_URL = "https://sheetdb.io/api/v1/jcei39pmynbh5";
  const TOTAL_NUMEROS = 71; // Del 00 al 70
  const PRECIO_CADA_UNO = 800;
  let numerosOcupados = [];
  let seleccionados = [];

  function copiarDatos() {
    const texto = "0102\n04241301804\n31758835";
    navigator.clipboard.writeText(texto).then(() => {
      alert("¡Datos copiados!\nBanco: 0102\nTel: 04241301804\nCI: 31758835");
    });
  }

  async function cargarNumeros() {
    const grid = document.getElementById("grid");
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      numerosOcupados = [];
      data.forEach(row => {
        if (row.Numero) {
          const nums = String(row.Numero).split(',');
          nums.forEach(n => numerosOcupados.push(n.trim().padStart(2, '0')));
        }
      });
    } catch (e) {
      console.error("Error al cargar ocupados:", e);
    }

    grid.innerHTML = "";
    for (let i = 0; i < TOTAL_NUMEROS; i++) {
      const numStr = String(i).padStart(2, '0');
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = numStr;
      btn.className = "num-btn";

      if (numerosOcupados.includes(numStr)) {
        btn.classList.add("ocupado");
        btn.disabled = true;
      } else {
        if (seleccionados.includes(numStr)) {
          btn.classList.add("seleccionado");
        }
        btn.onclick = () => alternarNumero(numStr, btn);
      }
      grid.appendChild(btn);
    }
  }

  function alternarNumero(numStr, btnElement) {
    const index = seleccionados.indexOf(numStr);
    if (index > -1) {
      seleccionados.splice(index, 1);
      btnElement.classList.remove("seleccionado");
    } else {
      seleccionados.push(numStr);
      btnElement.classList.add("seleccionado");
    }
    
    seleccionados.sort((a, b) => parseInt(a) - parseInt(b));

    document.getElementById("numerosSeleccionados").value = seleccionados.join(", ");
    const totalBs = seleccionados.length * PRECIO_CADA_UNO;
    document.getElementById("montoTotal").textContent = `Total a pagar: ${totalBs} Bs (${seleccionados.length} tickets)`;
  }

  // Compresor de imagen automático en el navegador (reduce fotos pesadas a ~120 KB)
  function comprimirImagen(file, maxWidth = 900, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          // Convertir a Blob JPEG comprimido
          canvas.toBlob((blob) => {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("Error al comprimir la imagen."));
            }
          }, "image/jpeg", quality);
        };
        img.onerror = () => reject(new Error("El archivo seleccionado no es una imagen válida."));
        img.src = event.target.result;
      };
      reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("rifaForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (seleccionados.length === 0) return alert("Por favor selecciona al menos un número.");

    const btn = document.getElementById("btnEnviar");
    const status = document.getElementById("statusMsg");
    const fileInput = document.getElementById("comprobante");

    if (!fileInput.files || !fileInput.files[0]) {
      return alert("Por favor adjunta la captura del pago.");
    }

    btn.disabled = true;
    btn.textContent = "Optimizando foto...";
    status.style.color = "#f3e5ab";
    status.textContent = "Comprimiendo captura para subida rápida...";

    try {
      // 1. Comprimir imagen antes de enviarla
      const imagenComprimida = await comprimirImagen(fileInput.files[0]);

      // 2. Subir imagen comprimida a ImgBB
      btn.textContent = "Subiendo comprobante...";
      status.textContent = "Enviando comprobante al servidor...";
      
      const formData = new FormData();
      formData.append("image", imagenComprimida, "comprobante.jpg");

      const imgRes = await fetch("https://api.imgbb.com/1/upload?key=6d203673c70ab92ba89657cc43cf9d98", {
        method: "POST",
        body: formData
      });
      const imgData = await imgRes.json();
      
      let imageUrl = "";
      if (imgData.success && imgData.data && imgData.data.url) {
        imageUrl = imgData.data.url;
      } else {
        throw new Error("El servidor de imágenes está ocupado. Intenta de nuevo en unos segundos.");
      }

      // 3. Guardar en Google Sheets via SheetDB
      btn.textContent = "Registrando tickets...";
      status.textContent = "Guardando tus números en la lista...";

      const nuevoRegistro = {
        data: [{
          Fecha: new Date().toLocaleString(),
          Numero: seleccionados.join(", "),
          Nombre: document.getElementById("nombre").value.trim(),
          Telefono: document.getElementById("telefono").value.trim(),
          Comprobante: imageUrl
        }]
      };

      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(nuevoRegistro)
      });

      if (res.ok) {
        status.style.color = "#34d399";
        status.textContent = `¡Listo! Números (${seleccionados.join(", ")}) apartados con éxito.`;
        document.getElementById("rifaForm").reset();
        seleccionados = [];
        document.getElementById("montoTotal").textContent = "Total a pagar: 0 Bs";
        await cargarNumeros();
      } else {
        throw new Error("Error al guardar en la base de datos.");
      }
    } catch (err) {
      status.style.color = "#f87171";
      status.textContent = err.message || "Ocurrió un error al procesar. Intenta nuevamente.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Apartar Números";
    }
  });

  cargarNumeros();
</script>
</body>
</html>
