<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gran Rifa - Licuadora Dorada</title>
  <style>
    :root {
      --bg-dark: #120806;
      --card-bg: #1c100c;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --red-accent: #991b1b;
      --text-main: #f9fafb;
      --text-muted: #d1d5db;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      margin: 0;
      padding: 0;
      color: var(--text-main);
    }

    /* Portada y Perfil */
    .profile-header {
      position: relative;
      width: 100%;
      background: #000;
    }

    .portada-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      filter: brightness(0.85);
    }

    .profile-container {
      max-width: 480px;
      margin: -50px auto 0 auto;
      padding: 0 16px;
      position: relative;
      text-align: center;
      z-index: 10;
    }

    .avatar-wrapper {
      width: 100px;
      height: 100px;
      margin: 0 auto;
      border-radius: 50%;
      border: 3px solid var(--gold);
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
      background: #000;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .container {
      max-width: 480px;
      margin: 16px auto 30px auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin: 12px 0 4px 0;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p.sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* Caja de Pago Móvil */
    .info-pago {
      background: rgba(28, 16, 12, 0.9);
      border: 2px solid var(--gold);
      padding: 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.1);
    }

    .info-pago strong {
      color: var(--gold-light);
    }

    .btn-copiar {
      margin-top: 10px;
      width: 100%;
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #120806;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-copiar:active {
      transform: scale(0.98);
    }

    /* Cuadrícula de Números */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 20px;
      max-height: 260px;
      overflow-y: auto;
      padding: 4px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
    }

    .num-btn {
      padding: 10px 0;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      background: #261712;
      color: var(--text-main);
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .num-btn.ocupado {
      background: #450a0a;
      border-color: #7f1d1d;
      color: #fca5a5;
      text-decoration: line-through;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .num-btn.seleccionado {
      background: #059669;
      border-color: #10b981;
      color: #fff;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: var(--gold-light);
    }

    input[type="text"], input[type="tel"], input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
      background: #0f0705;
      color: #fff;
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .monto-box {
      background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #120806;
      padding: 10px;
      border-radius: 8px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 16px;
      font-size: 1.05rem;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
      transition: 0.2s;
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    button[type="submit"]:disabled {
      background: #4b5563;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<!-- Portada y Foto de Perfil -->
<div class="profile-header">
  <img src="https://raw.githubusercontent.com/BatmanImperium/registros-de-pagos/main/1000271175.jpg" alt="Portada Rifa" class="portada-img">
</div>

<div class="profile-container">
  <div class="avatar-wrapper">
    <img src="https://raw.githubusercontent.com/BatmanImperium/registros-de-pagos/main/1000271175.jpg" alt="Logo Empresa" class="avatar-img">
  </div>
</div>

<div class="container">
  <h1>Licuadora Dorada</h1>
  <p class="sub">Selecciona tus números (00 al 70), aparta y sube tu comprobante.</p>

  <div class="info-pago">
    <strong>📱 Datos de Pago Móvil:</strong><br>
    • Banco: <strong>0102</strong><br>
    • Teléfono: <strong>04241301804</strong><br>
    • Cédula/RIF: <strong>V-31758835</strong><br>
    • Valor por ticket: <strong>800 Bs</strong>
    <button type="button" class="btn-copiar" onclick="copiarDatos()">📋 Copiar datos de pago</button>
  </div>

  <div id="grid" class="grid">Cargando números...</div>

  <form id="rifaForm">
    <div class="form-group">
      <label>Números seleccionados:</label>
      <input type="text" id="numerosSeleccionados" readonly placeholder="Toca tus números arriba" required>
    </div>
    
    <div class="monto-box" id="montoTotal">Total a pagar: 0 Bs</div>

    <div class="form-group">
      <label>Nombre y Apellido:</label>
      <input type="text" id="nombre" placeholder="Ej. Carlos Pérez" required>
    </div>
    <div class="form-group">
      <label>Teléfono (WhatsApp):</label>
      <input type="tel" id="telefono" placeholder="Ej. 04241234567" required>
    </div>
    <div class="form-group">
      <label>Comprobante de pago (Captura):</label>
      <input type="file" id="comprobante" accept="image/*" required>
    </div>
    <button type="submit" id="btnEnviar">Apartar Números</button>
    <div id="statusMsg" class="status"></div>
  </form>
</div>

<script>
  const API_URL = "https://sheetdb.io/api/v1/jcei39pmynbh5";
  const TOTAL_NUMEROS = 71; // Del 00 al 70
  const PRECIO_CADA_UNO = 800;
  let numerosOcupados = [];
  let seleccionados = [];

  function copiarDatos() {
    const texto = "Banco: 0102\nTeléfono: 04241301804\nCI/RIF: V-31758835\nMonto por ticket: 800 Bs";
    navigator.clipboard.writeText(texto).then(() => {
      alert("¡Datos de pago copiados al portapapeles!");
    });
  }

  async function cargarNumeros() {
    const grid = document.getElementById("grid");
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      numerosOcupados = [];
      data.forEach(row => {
        if(row.Numero) {
          const nums = String(row.Numero).split(',');
          nums.forEach(n => numerosOcupados.push(n.trim()));
        }
      });
    } catch (e) {
      console.error("Error al cargar ocupados:", e);
    }

    grid.innerHTML = "";
    for (let i = 0; i < TOTAL_NUMEROS; i++) {
      const numStr = String(i).padStart(2, '0');
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = numStr;
      btn.className = "num-btn";

      if (numerosOcupados.includes(numStr)) {
        btn.classList.add("ocupado");
        btn.disabled = true;
      } else {
        if (seleccionados.includes(numStr)) {
          btn.classList.add("seleccionado");
        }
        btn.onclick = () => alternarNumero(numStr, btn);
      }
      grid.appendChild(btn);
    }
  }

  function alternarNumero(numStr, btnElement) {
    const index = seleccionados.indexOf(numStr);
    if (index > -1) {
      seleccionados.splice(index, 1);
      btnElement.classList.remove("seleccionado");
    } else {
      seleccionados.push(numStr);
      btnElement.classList.add("seleccionado");
    }
    
    seleccionados.sort((a, b) => parseInt(a) - parseInt(b));

    document.getElementById("numerosSeleccionados").value = seleccionados.join(", ");
    const totalBs = seleccionados.length * PRECIO_CADA_UNO;
    document.getElementById("montoTotal").textContent = `Total a pagar: ${totalBs} Bs (${seleccionados.length} tickets)`;
  }

  document.getElementById("rifaForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (seleccionados.length === 0) return alert("Por favor selecciona al menos un número.");

    const btn = document.getElementById("btnEnviar");
    const status = document.getElementById("statusMsg");
    const fileInput = document.getElementById("comprobante");

    btn.disabled = true;
    btn.textContent = "Subiendo imagen...";
    status.textContent = "Subiendo comprobante al servidor...";

    try {
      const formData = new FormData();
      formData.append("image", fileInput.files[0]);

      const imgRes = await fetch("https://api.imgbb.com/1/upload?key=6d203673c70ab92ba89657cc43cf9d98", {
        method: "POST",
        body: formData
      });
      const imgData = await imgRes.json();
      
      if (!imgData.success) {
        throw new Error("No se pudo subir la foto. Intenta con una imagen más ligera.");
      }
      const imageUrl = imgData.data.url;

      status.textContent = "Guardando registro...";
      const nuevoRegistro = {
        data: [{
          Fecha: new Date().toLocaleString(),
          Numero: seleccionados.join(", "),
          Nombre: document.getElementById("nombre").value.trim(),
          Telefono: document.getElementById("telefono").value.trim(),
          Comprobante: imageUrl
        }]
      };

      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(nuevoRegistro)
      });

      if (res.ok) {
        status.style.color = "#34d399";
        status.textContent = `¡Éxito! Números (${seleccionados.join(", ")}) apartados correctamente.`;
        document.getElementById("rifaForm").reset();
        seleccionados = [];
        document.getElementById("montoTotal").textContent = "Total a pagar: 0 Bs";
        await cargarNumeros();
      } else {
        throw new Error("Error al guardar en la base de datos.");
      }
    } catch (err) {
      status.style.color = "#f87171";
      status.textContent = err.message || "Ocurrió un error al procesar. Intenta nuevamente.";
    } finally {
      btn.disabled = false;
      buttonText = "Apartar Números";
      document.getElementById("btnEnviar").textContent = "Apartar Números";
    }
  });

  cargarNumeros();
</script>
</body>
</html>
